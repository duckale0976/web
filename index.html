<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web HIS - Quản Lý Phòng Khám</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a73e8; }
        
        /* Tabs */
        .tabs { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 20px; }
        .tab { padding: 10px 20px; cursor: pointer; font-weight: bold; color: #555; border: none; background: none; font-size: 16px; }
        .tab.active { color: #1a73e8; border-bottom: 3px solid #1a73e8; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Forms */
        .form-group { margin-bottom: 15px; display: flex; align-items: center; }
        .form-group label { width: 120px; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #1a73e8; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #1557b0; }

        /* Table */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        table, th, td { border: 1px solid #ddd; }
        th, td { padding: 12px; text-align: left; }
        th { background-color: #f8f9fa; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏥 Hệ Thống Quản Lý Phòng Khám (Web HIS)</h2>
    
    <div class="tabs">
        <button class="tab active" onclick="switchTab(event, 'reception')">Tiếp Đón Bệnh Nhân</button>
        <button class="tab" onclick="switchTab(event, 'treatment')">Khám & Điều Trị</button>
    </div>

    <div id="reception" class="tab-content active">
        <fieldset>
            <legend><b>Thông tin đăng ký</b></legend>
            <div class="form-group">
                <label>Họ tên:</label> <input type="text" id="p_name" placeholder="Nhập họ tên...">
            </div>
            <div class="form-group">
                <label>Tuổi:</label> <input type="number" id="p_age" placeholder="Nhập tuổi...">
            </div>
            <div class="form-group">
                <label>Giới tính:</label> 
                <select id="p_gender">
                    <option value="Nam">Nam</option>
                    <option value="Nữ">Nữ</option>
                    <option value="Khác">Khác</option>
                </select>
            </div>
            <div class="form-group">
                <label>Số điện thoại:</label> <input type="text" id="p_phone" placeholder="Nhập SĐT...">
            </div>
            <button onclick="addPatient()">Lưu Bệnh Nhân</button>
        </fieldset>

        <h3 style="margin-top: 20px;">Danh sách bệnh nhân chờ</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th><th>Họ Tên</th><th>Tuổi</th><th>Giới Tính</th><th>SĐT</th>
                </tr>
            </thead>
            <tbody id="patient_table_body">
                </tbody>
        </table>
    </div>

    <div id="treatment" class="tab-content">
        <fieldset>
            <legend><b>Bệnh Án Điện Tử</b></legend>
            <div class="form-group">
                <label>ID Bệnh Nhân:</label> <input type="number" id="t_patient_id" placeholder="Nhập ID bệnh nhân từ bảng bên kia...">
            </div>
            <div class="form-group">
                <label>Triệu chứng:</label> <textarea id="t_symptoms" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Chẩn đoán:</label> <input type="text" id="t_diagnosis">
            </div>
            <div class="form-group">
                <label>Kê đơn thuốc:</label> <textarea id="t_prescription" rows="3"></textarea>
            </div>
            <button onclick="saveTreatment()">Lưu Hồ Sơ Khám</button>
        </fieldset>
    </div>
</div>

<script>
    // Khởi tạo dữ liệu từ LocalStorage (Nếu chưa có thì tạo mảng rỗng)
    let patients = JSON.parse(localStorage.getItem('his_patients')) || [];
    let treatments = JSON.parse(localStorage.getItem('his_treatments')) || [];

    // Chuyển đổi giữa các Tabs
    function switchTab(evt, tabName) {
        let tabContents = document.getElementsByClassName("tab-content");
        for (let i = 0; i < tabContents.length; i++) tabContents[i].classList.remove("active");
        
        let tabs = document.getElementsByClassName("tab");
        for (let i = 0; i < tabs.length; i++) tabs[i].classList.remove("active");
        
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.classList.add("active");
    }

    // Thêm bệnh nhân
    function addPatient() {
        let name = document.getElementById("p_name").value;
        let age = document.getElementById("p_age").value;
        let gender = document.getElementById("p_gender").value;
        let phone = document.getElementById("p_phone").value;

        if (!name || !age) {
            alert("Vui lòng nhập Họ Tên và Tuổi!");
            return;
        }

        // Tự động tăng ID
        let newId = patients.length > 0 ? Math.max(...patients.map(p => p.id)) + 1 : 1;
        
        let newPatient = { id: newId, name, age, gender, phone };
        patients.push(newPatient);
        
        // Lưu vào LocalStorage
        localStorage.setItem('his_patients', JSON.stringify(patients));
        
        alert("Đã thêm bệnh nhân thành công!");
        
        // Xóa form
        document.getElementById("p_name").value = "";
        document.getElementById("p_age").value = "";
        document.getElementById("p_phone").value = "";
        
        loadPatients();
    }

    // Hiển thị danh sách bệnh nhân
    function loadPatients() {
        let tbody = document.getElementById("patient_table_body");
        tbody.innerHTML = "";
        
        patients.forEach(p => {
            let row = `<tr>
                <td><b>${p.id}</b></td>
                <td>${p.name}</td>
                <td>${p.age}</td>
                <td>${p.gender}</td>
                <td>${p.phone}</td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    // Lưu hồ sơ khám bệnh
    function saveTreatment() {
        let p_id = parseInt(document.getElementById("t_patient_id").value);
        let symptoms = document.getElementById("t_symptoms").value;
        let diagnosis = document.getElementById("t_diagnosis").value;
        let prescription = document.getElementById("t_prescription").value;

        if (!p_id || !diagnosis) {
            alert("Vui lòng nhập ID Bệnh Nhân và Chẩn đoán!");
            return;
        }

        // Kiểm tra xem ID bệnh nhân có tồn tại không
        let patientExists = patients.find(p => p.id === p_id);
        if (!patientExists) {
            alert("Lỗi: Không tìm thấy bệnh nhân có ID là " + p_id);
            return;
        }

        let newTreatment = { 
            patient_id: p_id, 
            date: new Date().toLocaleString(), 
            symptoms, diagnosis, prescription 
        };
        
        treatments.push(newTreatment);
        localStorage.setItem('his_treatments', JSON.stringify(treatments));
        
        alert(`Đã lưu hồ sơ khám cho bệnh nhân: ${patientExists.name}`);
        
        // Xóa form
        document.getElementById("t_patient_id").value = "";
        document.getElementById("t_symptoms").value = "";
        document.getElementById("t_diagnosis").value = "";
        document.getElementById("t_prescription").value = "";
    }

    // Tải danh sách ngay khi mở trang
    window.onload = loadPatients;
</script>

</body>
</html>
